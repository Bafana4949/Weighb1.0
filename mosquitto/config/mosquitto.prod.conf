# Production broker. Copy to the broker host and mount as /mosquitto/config/mosquitto.conf.
# - no anonymous access
# - TLS on 8883 (plain 1883 is not exposed)
# - every edge controller and the cloud have their own username (see mosquitto/README.md)
# - ACLs confine each edge to its own tenant/site subtree
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Optional loopback listener for health checks inside the container only.
listener 1883 127.0.0.1

listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
# require_certificate true   # enable for mutual TLS (client certificates per edge)

max_inflight_messages 100
max_queued_messages 5000
message_size_limit 262144
