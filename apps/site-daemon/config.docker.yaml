site:
  id: "WOESTALLEEN"
  name: "Woestalleen Colliery"
  timezone: "Africa/Johannesburg"
  operating_hours: { start: "05:00", end: "22:00" }
weighbridge:
  max_capacity_kg: 80000
  stability_threshold_kg: 20
  stability_duration_seconds: 3
  overload_tolerance_percent: 5
  positioning_hold_seconds: 2
  reading_interval_ms: 100
  unstable_timeout_seconds: 60
  empty_scale_threshold_kg: 500
  empty_vehicle_max_kg: 18500
  loaded_vehicle_max_kg: 70000
anpr:
  confidence_threshold: 0.75
  max_retries: 3
  retry_interval_ms: 500
  camera_source: "test_plates/sample_01.png"
  rapid_capture_count: 5
transport:
  mode: "tcp"
  tcp_host: "host.docker.internal"
  tcp_port: 7001
serial:
  port: "/dev/ttyUSB0"
  baud_rate: 115200
  timeout_seconds: 1
  reconnect_seconds: 5
  manual_mode_after_seconds: 30
mqtt:
  broker: "mosquitto"
  port: 1883
  keepalive: 60
  username: null
  password: null
  memory_buffer_limit: 1000
cloud:
  api_url: "http://host.docker.internal:3010/api"
  site_api_key: "3f1fddae9eaa2ce74b118a22b041a70732f1700c6c86430126e380e6189db50d"
  sync_interval_seconds: 30
  max_offline_hours: 72
  request_timeout_seconds: 8
storage:
  sqlite_path: "/data/edge.db"
  backup_directory: "/data/backups"
  backup_interval_seconds: 3600
  evidence_directory: "/data/evidence"
notifications:
  sms_enabled: false
  operator_user_ids: []
  admin_user_ids: []
