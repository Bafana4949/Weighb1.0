name: weighbridge-system

# Profiles
#   (default)   postgres + mosquitto for local development
#   cloud       + web (Next.js) — the central platform
#   edge        + site-daemon + hardware-simulator — a simulated single-lane site
#   edge-dual   + one daemon serving two simulated lanes (entry/exit topology)
#   admin-tools + pgAdmin
# Production sites run the site-daemon image on the edge PC with real hardware and
# WB_ENV=production; see docs/DEPLOYMENT_GUIDE.md and docs/EDGE_DEPLOYMENT.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weighbridge}
      POSTGRES_USER: ${POSTGRES_USER:-weighbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weighbridge_dev_change_me}
    # Bound to loopback only. POSTGRES_HOST_PORT is configurable because Windows
    # Hyper-V reserves dynamic port ranges (check with
    # `netsh interface ipv4 show excludedportrange protocol=tcp`).
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weighbridge} -d ${POSTGRES_DB:-weighbridge}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Development broker: anonymous, loopback-only. Production uses
  # mosquitto/config/mosquitto.prod.conf (TLS, passwords, per-site ACLs).
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    profiles: ["admin-tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@weighbridge.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin-change-me}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    profiles: ["cloud"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-weighbridge}:${POSTGRES_PASSWORD:-weighbridge_dev_change_me}@postgres:5432/${POSTGRES_DB:-weighbridge}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-weighbridge}:${POSTGRES_PASSWORD:-weighbridge_dev_change_me}@postgres:5432/${POSTGRES_DB:-weighbridge}?schema=public
      # The app refuses to start in production with a placeholder secret.
      AUTH_SECRET: ${AUTH_SECRET:-development-secret-change-before-production}
      AUTH_TRUST_HOST: "true"
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3010}
      MQTT_URL: mqtt://mosquitto:1883
      # Optional co-located edge controller (one site) for live telemetry / commands.
      SITE_DAEMON_URL: ${SITE_DAEMON_URL:-}
      SITE_DAEMON_SITE_CODE: ${SITE_DAEMON_SITE_CODE:-}
      SITE_DAEMON_TOKEN: ${WB_LOCAL_API_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Weighbridge Platform <noreply@example.test>}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    ports:
      - "3010:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # Simulated single-lane site. Issue the site's key in Hardware → Configuration →
  # Edge controller, then export WB_SITE_API_KEY before `docker compose --profile edge up`.
  site-daemon:
    build:
      context: ./apps/site-daemon
      args:
        INSTALL_ANPR: ${INSTALL_ANPR:-false}
    restart: unless-stopped
    profiles: ["edge"]
    environment:
      WB_ENV: development
      WB_ALLOW_SIMULATION: "true"
      WB_CONFIG_PATH: /app/config.docker.dev.yaml
      WB_EDGE_DB_PATH: /data/edge.db
      WB_SITE_API_KEY: ${WB_SITE_API_KEY:-}
      WB_CLOUD_API_URL: ${WB_CLOUD_API_URL:-http://web:3000/api}
      WB_MQTT_URL: mqtt://mosquitto:1883
      WB_LOCAL_API_TOKEN: ${WB_LOCAL_API_TOKEN:-}
    volumes:
      - edge-data:/data
      - ./apps/site-daemon/config.docker.dev.yaml:/app/config.docker.dev.yaml:ro
      - ./apps/site-daemon/test_plates:/app/test_plates:ro
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      mosquitto:
        condition: service_started

  hardware-simulator:
    build:
      context: ./apps/hardware-simulator
    profiles: ["edge"]
    command: ["python", "simulator.py", "--headless", "--tcp-host", "0.0.0.0", "--tcp-port", "7001"]
    ports:
      - "127.0.0.1:7001:7001"
      - "127.0.0.1:7002:7002"

  # --- DUAL_ENTRY_EXIT demo site: one daemon, two independent simulated lanes.
  hardware-simulator-lane-a:
    build:
      context: ./apps/hardware-simulator
    profiles: ["edge-dual"]
    command: ["python", "simulator.py", "--headless", "--tcp-host", "0.0.0.0", "--tcp-port", "7001", "--control-port", "7002"]
    ports:
      - "127.0.0.1:7011:7001"
      - "127.0.0.1:7012:7002"

  hardware-simulator-lane-b:
    build:
      context: ./apps/hardware-simulator
    profiles: ["edge-dual"]
    command: ["python", "simulator.py", "--headless", "--tcp-host", "0.0.0.0", "--tcp-port", "7001", "--control-port", "7002"]
    ports:
      - "127.0.0.1:7013:7001"
      - "127.0.0.1:7014:7002"

  site-daemon-dual:
    build:
      context: ./apps/site-daemon
      args:
        INSTALL_ANPR: ${INSTALL_ANPR:-false}
    restart: unless-stopped
    profiles: ["edge-dual"]
    environment:
      WB_ENV: development
      WB_ALLOW_SIMULATION: "true"
      WB_CONFIG_PATH: /app/config.dual.docker.dev.yaml
      WB_EDGE_DB_PATH: /data/edge.db
      WB_SITE_API_KEY: ${WB_SITE_API_KEY_DUAL:-}
      WB_CLOUD_API_URL: ${WB_CLOUD_API_URL:-http://web:3000/api}
      WB_MQTT_URL: mqtt://mosquitto:1883
      WB_LOCAL_API_TOKEN: ${WB_LOCAL_API_TOKEN:-}
    volumes:
      - edge-data-dual:/data
      - ./apps/site-daemon/config.dual.docker.dev.yaml:/app/config.dual.docker.dev.yaml:ro
      - ./apps/site-daemon/test_plates:/app/test_plates:ro
    ports:
      - "127.0.0.1:8020:8000"
    depends_on:
      mosquitto:
        condition: service_started
      hardware-simulator-lane-a:
        condition: service_started
      hardware-simulator-lane-b:
        condition: service_started

volumes:
  postgres-data:
  pgadmin-data:
  mosquitto-logs:
  edge-data:
  edge-data-dual:
